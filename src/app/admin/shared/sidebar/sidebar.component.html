<aside class="sidebar" [class.collapsed]="collapsed" [class.mobile-open]="mobileOpen">
  <!-- Logo -->
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">
        <img src="assets/1.ico" alt="OptiPlant" class="logo-image">
      </div>
      <span class="logo-text" *ngIf="!collapsed">OptiPlant</span>
    </div>
    <button class="collapse-btn mobile-only" (click)="closeMobile.emit()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-section">
      <span class="nav-section-title" *ngIf="!collapsed">Principal</span>
      <a *ngFor="let item of mainNavItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         class="nav-item"
         (click)="closeMobile.emit()">
        <span class="nav-icon" [class]="item.icon"></span>
        <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !collapsed">{{ item.badge }}</span>
      </a>
    </div>


  </nav>
  
  <button class="nav-item logout-btn" (click)="onLogout()">
    <span class="nav-icon pi pi-sign-out"></span>
    <span class="nav-label" *ngIf="!collapsed">Cerrar sesión</span>
  </button>

  <!-- User Section -->
  <div class="sidebar-footer">
    <button class="nav-item collapse-btn desktop-only" (click)="toggleCollapse()">
      <span class="nav-icon pi" [class]="!collapsed ? 'pi-angle-left' : 'pi-angle-right'"></span>
      <span class="nav-label" *ngIf="!collapsed">Colapsar</span>
    </button>
  </div>

</aside>
