<header class="topbar" [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Botón hamburguesa — mobile -->
  <button
    class="menu-btn mobile-only"
    (click)="openMobile.emit()"
    aria-label="Abrir menú">
    <i class="pi pi-bars"></i>
  </button>

  <!-- Botón hamburguesa — desktop (colapsar sidebar) -->
  <button
    class="menu-btn desktop-only"
    (click)="toggleCollapse.emit()"
    aria-label="Colapsar sidebar">
    <i class="pi pi-bars"></i>
  </button>

  <!-- Título de la sección -->
  <div class="topbar-title">
    <h1>{{ title }}</h1>
    <p class="topbar-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <!-- Acciones del lado derecho -->
  <div class="topbar-actions">

    <!-- Reloj -->
    <div class="clock">
      <i class="pi pi-clock"></i>
      <span class="time">{{ currentTime }}</span>
      <span class="date">{{ currentDate }}</span>
    </div>

    <!-- Indicador de conexión -->
    <div class="connection-status">
      <i class="pi pi-wifi"></i>
      <span>En línea</span>
    </div>

    <!-- Notificaciones -->
    <button class="notif-btn" [attr.aria-label]="pendingAlerts + ' notificaciones pendientes'"> 
      <i class="pi pi-bell"></i>
      <span class="notif-badge" *ngIf="pendingAlerts > 0">{{ pendingAlerts }}</span>
    </button>

  </div>
</header>
